name: kind-perf-e2e
on:
  workflow_run:
    workflows:
      - ApprovalComment
    types:
      - completed
  workflow_dispatch:
jobs:
  kind-perf-e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Debug workflow_run trigger
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow run name: ${{ github.event.workflow_run.name }}"
      - name: Dump payload
        run: jq -c '{name:.workflow_run.name, display_title:.workflow_run.display_title, event:.workflow_run.event, head_branch:.workflow_run.head_branch, head_repo:.workflow_run.head_repository.full_name}' "$GITHUB_EVENT_PATH"
